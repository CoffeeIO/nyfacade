<script>
(function () {
  var ENDPOINT = "https://nyfacade-tracker.mathias-b8e.workers.dev/t";
  var SELF_KEY = "nf_self";

  // Own-visit exclusion. Open any preview once with #me and this browser stops
  // sending beacons on every nyfacade.dk preview from then on; #notme undoes it.
  // The flag lives in localStorage on YOUR device — nothing is sent, so there is
  // nothing to filter server-side. Set it once per browser you QA from.
  function isSelf() {
    var hash = location.hash;
    try {
      if (hash === "#notme") {
        localStorage.removeItem(SELF_KEY);
        return false;
      }
      if (hash === "#me") {
        localStorage.setItem(SELF_KEY, "1");
        return true;
      }
      return localStorage.getItem(SELF_KEY) === "1";
    } catch (e) {
      return hash === "#me"; // private window, storage blocked
    }
  }

  if (isSelf()) return;

  var page = location.pathname.replace(/\/$/, "").split("/").pop();
  var start = Date.now(), maxDepth = 0, closed = false;

  function depth() {
    var scrollable = document.documentElement.scrollHeight - innerHeight;
    return scrollable > 0
      ? Math.min(100, Math.round((scrollY / scrollable) * 100))
      : 100;
  }

  function send(event) {
    var body = JSON.stringify({
      p: page, e: event, d: maxDepth,
      s: Math.round((Date.now() - start) / 1000)
    });
    navigator.sendBeacon(ENDPOINT, new Blob([body], { type: "text/plain" }));
  }

  addEventListener("scroll", function () {
    var d = depth();
    if (d > maxDepth) maxDepth = d;
  }, { passive: true });

  send("arrive");

  addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden" && !closed) {
      closed = true;
      send("leave");
    }
  });
})();
</script>
